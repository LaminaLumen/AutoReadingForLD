<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>澜阅视觉验证</title>
    <style>
        :root {
            color-scheme: light;
            --page: #f5f4ef;
            --surface: #fffefb;
            --ink: #242a26;
            --muted: #747b75;
            --line: #dedfd9;
            --accent: #2f6f59;
        }

        html.dark {
            color-scheme: dark;
            --page: #141815;
            --surface: #1c221e;
            --ink: #edf0e9;
            --muted: #a1aaa3;
            --line: #343d36;
            --accent: #86b8a5;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--page);
            font-family: "Segoe UI", "PingFang SC", sans-serif;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 62px;
            padding: 0 24px;
            border-bottom: 1px solid var(--line);
            background: color-mix(in srgb, var(--surface) 92%, transparent);
            backdrop-filter: blur(16px);
        }

        header strong { letter-spacing: .08em; }
        header span { color: var(--muted); font-size: 13px; }

        main {
            width: min(820px, calc(100% - 32px));
            margin: 34px auto 120px;
        }

        .topic-shell, .topic-list {
            padding: clamp(24px, 5vw, 52px);
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--surface);
            box-shadow: 0 18px 60px rgba(20, 30, 24, .06);
        }

        h1 { margin: 0 0 12px; font-family: Georgia, "Noto Serif SC", serif; font-size: clamp(30px, 5vw, 48px); }
        .meta { color: var(--muted); margin-bottom: 36px; }
        p { margin: 0 0 1.45em; font-family: Georgia, "Noto Serif SC", serif; font-size: 18px; line-height: 1.9; }

        .topic-list-item, .latest-topic-list-item {
            display: grid;
            gap: 5px;
            padding: 16px 0;
            border-bottom: 1px solid var(--line);
        }

        .topic-list-item:last-child, .latest-topic-list-item:last-child { border-bottom: 0; }
        .topic-list-item a, .latest-topic-list-item a { color: var(--ink); font-size: 17px; font-weight: 700; text-decoration: none; }
        .topic-list-item small, .latest-topic-list-item small { color: var(--muted); }
        .new-topic { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: var(--accent); }
        .load-more-sentinel { height: 1px; width: 100%; visibility: hidden; position: relative; }

        .topic-post {
            padding: 28px 0 20px;
            border-top: 1px solid var(--line);
        }

        .topic-post:first-child { border-top: 0; }
        .post-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .post-number { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
        .read-state { width: 7px; height: 7px; border-radius: 50%; background: #45a8df; }
        .read-state.read { visibility: hidden; opacity: 0; transition: visibility 1s, opacity 1s ease-out; }
    </style>
</head>
<body>
    <header>
        <strong>LINUX DO</strong>
        <span>澜阅本地视觉验证页</span>
    </header>
    <main id="main"></main>
    <script>
        const params = new URLSearchParams(location.search);
        if (params.get('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        const main = document.getElementById('main');
        const topicPostCounts = [6, 18, 42, 80, 120, 10, 25, 60, 150, 35, 95, 12];
        const listRoute = /^\/(new|unread|unseen|latest)/.test(location.pathname);
        if (listRoute) {
            const renderListRows = (start, end) => Array.from({ length: end - start }, (_, offset) => {
                const index = start + offset;
                const slot = index % 12;
                const visited = [1, 4, 8].includes(slot);
                const unread = ![2, 6, 10].includes(slot);
                const eligible = unread && !visited;
                const rowClass = slot === 7 ? 'latest-topic-list-item' : 'topic-list-item';
                return `
                    <div class="${rowClass} ${visited ? 'visited' : unread ? 'unseen-topic' : ''}" data-fixture-eligible="${eligible}">
                        <a class="title raw-topic-link" href="/t/topic/${1001 + index}">
                            ${unread ? '<span class="badge-notification new-topic"></span>' : ''}测试长帖 ${index + 1}：阅读节奏与排版
                        </a>
                        <small>${topicPostCounts[slot] - 1} 条回复 · 刚刚更新</small>
                    </div>
                `;
            }).join('');
            main.innerHTML = `
                <section class="topic-list">
                    <h1>新帖列表</h1>
                    <p class="meta">用于验证连续阅读模式，不连接真实站点。</p>
                    <div data-topic-list>${renderListRows(0, 12)}</div>
                </section>
                <div class="load-more-sentinel" data-list-sentinel></div>
            `;

            const listFixture = { loadedRows: 12, loadRequests: [] };
            window.__readingListFixture = listFixture;
            let loading = false;
            const sentinel = document.querySelector('[data-list-sentinel]');
            const loader = new IntersectionObserver((entries) => {
                if (!entries[0]?.isIntersecting || loading || listFixture.loadedRows >= 60) {
                    return;
                }
                loading = true;
                listFixture.loadRequests.push({ loadedRows: listFixture.loadedRows, at: performance.now() });
                window.setTimeout(() => {
                    document.querySelector('[data-topic-list]').insertAdjacentHTML(
                        'beforeend', renderListRows(listFixture.loadedRows, listFixture.loadedRows + 12)
                    );
                    listFixture.loadedRows += 12;
                    loading = false;
                    if (listFixture.loadedRows >= 60) {
                        loader.disconnect();
                        sentinel.remove();
                    }
                }, 450);
            });
            loader.observe(sentinel);
        } else {
            const topicId = location.pathname.match(/(\d+)/)?.[1] || '1001';
            const topicIndex = Math.max(0, Number(topicId) - 1001);
            const lazyScenario = topicId === '1099';
            const megaScenario = topicId === '1097';
            const stalledScenario = topicId === '1096';
            const chunkScenario = topicId === '1098' || megaScenario;
            const plannedPostCount = lazyScenario
                ? 6
                : megaScenario ? 7545
                : chunkScenario ? 42
                : stalledScenario ? 42
                : topicPostCounts[topicIndex % topicPostCounts.length];
            const finalPostCount = lazyScenario ? 42 : plannedPostCount;
            const initialPostCount = chunkScenario || stalledScenario ? 8 : plannedPostCount;

            const renderPosts = (start, end) => Array.from({ length: end - start + 1 }, (_, offset) => {
                const postNumber = start + offset;
                return `
                    <section class="topic-post" data-post-id="${postNumber}" data-post-number="${postNumber}">
                        <div class="post-meta">
                            <div class="post-number">第 ${postNumber} 层</div>
                            <div class="read-state" title="帖子未读" aria-label="第 ${postNumber} 层未读"></div>
                        </div>
                        ${Array.from({ length: 3 }, (_, paragraphIndex) => `
                            <p>这是第 ${postNumber} 层的第 ${paragraphIndex + 1} 段验证内容。连续阅读需要根据楼层规模安排足够的停留时间，同时保持稳定、自然的滚动节奏，并在正文继续加载时及时延长本篇计划。</p>
                        `).join('')}
                    </section>
                `;
            }).join('');

            main.innerHTML = `
                <div class="topic-progress" hidden>
                    <span class="nums"><span>1</span> / <span class="total">${plannedPostCount}</span></span>
                </div>
                <article class="topic-shell">
                    <h1>测试长帖 ${topicId}：让阅读保持自己的节奏</h1>
                    <div class="meta">视觉与连续阅读行为验证 · 共 <span data-fixture-post-count>${plannedPostCount}</span> 层</div>
                    <div class="post-stream" data-post-stream>
                        ${renderPosts(1, initialPostCount)}
                        ${lazyScenario || chunkScenario || stalledScenario
                            ? '<div class="load-more-sentinel"></div>'
                            : '<div class="post-stream__bottom-boundary"></div>'}
                    </div>
                </article>
            `;

            if (lazyScenario) {
                window.setTimeout(() => {
                    document.querySelector('.topic-progress .total').textContent = String(finalPostCount);
                    document.querySelector('[data-fixture-post-count]').textContent = String(finalPostCount);
                    document.querySelector('.load-more-sentinel').insertAdjacentHTML(
                        'beforebegin',
                        renderPosts(plannedPostCount + 1, finalPostCount)
                    );
                    document.querySelector('.load-more-sentinel').outerHTML = '<div class="post-stream__bottom-boundary"></div>';
                }, 8000);
            }

            if (chunkScenario) {
                let loadedCount = initialPostCount;
                let loading = false;
                const sentinel = document.querySelector('.load-more-sentinel');
                const loader = new IntersectionObserver((entries) => {
                    if (!entries[0]?.isIntersecting || loading || loadedCount >= finalPostCount) {
                        return;
                    }
                    loading = true;
                    window.__readingFixture.loadRequests.push({ loadedCount, at: performance.now(), scrollY });
                    window.setTimeout(() => {
                        const end = Math.min(finalPostCount, loadedCount + 8);
                        sentinel.insertAdjacentHTML('beforebegin', renderPosts(loadedCount + 1, end));
                        loadedCount = end;
                        loading = false;
                        if (loadedCount >= finalPostCount) {
                            loader.disconnect();
                            sentinel.outerHTML = '<div class="post-stream__bottom-boundary"></div>';
                        }
                    }, 900);
                });
                loader.observe(sentinel);
            }

            const reportMode = params.get('report') || 'normal';
            const reportDelayMs = Math.min(
                30000,
                Math.max(500, Number(params.get('reportDelay')) || 2200)
            );
            const fixtureReport = {
                mode: reportMode,
                delayMs: reportDelayMs,
                exposureMs: new Map(),
                reported: [],
                sentBatches: [],
                loadRequests: []
            };
            window.__readingFixture = fixtureReport;

            let lastReportSampleAt = performance.now();
            window.setInterval(() => {
                const now = performance.now();
                const delta = Math.min(300, now - lastReportSampleAt);
                lastReportSampleAt = now;
                if (document.hidden) {
                    return;
                }

                const newlyReported = [];
                document.querySelectorAll('.topic-post').forEach((post) => {
                    const postNumber = Number(post.dataset.postNumber);
                    const readState = post.querySelector('.read-state:not(.read)');
                    if (!postNumber || !readState) {
                        return;
                    }

                    const rect = post.getBoundingClientRect();
                    if (rect.bottom <= 62 || rect.top >= innerHeight) {
                        return;
                    }

                    const exposure = (fixtureReport.exposureMs.get(postNumber) || 0) + delta;
                    fixtureReport.exposureMs.set(postNumber, exposure);
                    if (reportMode !== 'stuck' && exposure >= reportDelayMs) {
                        readState.classList.add('read');
                        fixtureReport.reported.push(postNumber);
                        newlyReported.push(postNumber);
                    }
                });

                if (newlyReported.length > 0) {
                    fixtureReport.sentBatches.push({ posts: newlyReported, at: now });
                    document.dispatchEvent(new CustomEvent('topic:timings-sent', {
                        detail: { timings: Object.fromEntries(newlyReported.map((postNumber) => [postNumber, reportDelayMs])) }
                    }));
                }
            }, 250);
        }
    </script>
    <script src="/Lanyue.user.js"></script>
</body>
</html>
